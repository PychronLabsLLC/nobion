# Copy to /etc/grafana/provisioning/dashboards/ on the box. Grafana then
# loads every dashboard under `path` into a folder called Nobion.
apiVersion: 1

providers:
  - name: nobion
    orgId: 1
    folder: Nobion
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards/nobion
