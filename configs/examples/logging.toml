# Logging for every nobion program that reads this install folder
# (nobion, elctl). Optional: every key below shows its default.
# logging.local.toml beside this file overrides it for this computer only.
# Levels: trace|debug|info|warn|error.

# Folder of the log file. Unset: <install>/logs for an install, else the
# system's log folder. dir = "" turns the file off.
# dir = "~/nobion-logs"

# Size at which the file rolls over, and how many rolled files are kept.
# max_size_mb = 50
# max_files = 10

# Level of loggers with no entry in [levels] below.
# default_level = "debug"

# What the log dock shows.
# dock_level = "info"

# Also write each record to stderr.
# echo_stderr = false

# Per-logger overrides, by name glob. Each transport logs its bytes at trace
# to "<transport name>.wire". A [levels] table here replaces the whole list
# the line's own [logging.levels] gave.
# [levels]
# "*.wire" = "trace"
# "scheduler" = "debug"

# Flight recorder: the last minutes of everything, kept in memory (also what
# is below the file's level) and written out when something goes wrong.
# [recorder]
# enabled = true
# size_mb = 32            # 4 to 512
# default_level = "debug"
# [recorder.levels]
# "*.wire" = "trace"      # wire bytes are always kept
