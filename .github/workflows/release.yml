# Installers for the three platforms (installation wizard spec section 3.7).
#
# For a release (called by release-please.yml with the new tag, or on a v* tag
# pushed by hand): build, smoke-test the installed package and attach it to
# the GitHub release. On a pull request into main that touches packaging, and
# on demand: the same build and smoke test, packages kept as workflow
# artifacts only.
#
# Each package carries a relocatable CPython (python-build-standalone) for
# scripted extractions; the programs are linked against that Python and find
# it beside themselves. Qt comes with the package on macOS and Windows; the
# .deb depends on Ubuntu's Qt.
#
# macOS: Nobion.app is signed with the hardened runtime, and the .dmg signed,
# notarized and stapled, when the repository has these secrets
# (docs/installation_runbook.md, "Signing and notarizing the macOS package"):
#   MACOS_CERTIFICATE_P12_BASE64, MACOS_CERTIFICATE_PASSWORD   Developer ID Application
#   APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID   App Store Connect API key
# Without them the app is signed ad hoc, so the same signing and the hardened
# runtime are still checked, and the package is neither notarized nor fit to
# hand out. A release without them says so in a warning.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - cmake/NobionInstall.cmake
      - cmake/NobionPackaging.cmake
      - packaging/**
      - .github/workflows/release.yml
  # By hand: the packages as workflow artifacts; given a tag, built from it and
  # attached to its release (to make up a release whose packages failed).
  workflow_dispatch:
    inputs:
      tag:
        description: A release's tag (vX.Y.Z) to build and attach to; empty for artifacts only.
        type: string
        required: false
        default: ""
  workflow_call:
    inputs:
      tag:
        description: The release's tag; the packages are built from it and attached to its release.
        type: string
        required: true

permissions:
  contents: write

env:
  PBS_RELEASE: "20250918"
  PBS_PYTHON: "3.12.11"

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            pbs: x86_64-unknown-linux-gnu
          - name: macos
            os: macos-15
            pbs: aarch64-apple-darwin
          - name: windows
            os: windows-2022
            pbs: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build dpkg-dev
          qt6-base-dev libqt6sql6-sqlite libqt6sql6-psql

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install qt ninja

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      # ci.yml's convention: Windows runners have `python`, the others `python3`.
      # -I: the tools read nothing from the working directory.
      - name: Python for the tools
        run: |
          if [ "$RUNNER_OS" = Windows ]; then echo "PY=python -I" >> "$GITHUB_ENV"; else echo "PY=python3 -I" >> "$GITHUB_ENV"; fi

      - name: Relocatable Python
        run: |
          url="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/cpython-${PBS_PYTHON}+${PBS_RELEASE}-${{ matrix.pbs }}-install_only.tar.gz"
          curl -sSfL "$url" -o python.tar.gz
          tmp="$RUNNER_TEMP"
          # D:/a/_temp, not D:\a\_temp: CMake reads it; and tar is never handed a
          # path with a drive letter, which it takes for host:path.
          if [ "$RUNNER_OS" = Windows ]; then tmp=$(cygpath -m "$RUNNER_TEMP"); fi
          mkdir -p "$tmp/pbs" && (cd "$tmp/pbs" && tar xzf "$OLDPWD/python.tar.gz")
          pbs="$tmp/pbs/python"
          if [ "$RUNNER_OS" = macOS ]; then
            # Link it through the RPATH the install sets.
            install_name_tool -id @rpath/libpython3.12.dylib "$pbs/lib/libpython3.12.dylib"
            codesign --force --sign - "$pbs/lib/libpython3.12.dylib"
          fi
          echo "PBS=$pbs" >> "$GITHUB_ENV"

      - name: Signing identity (macOS)
        if: runner.os == 'macOS'
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then
            echo "NOBION_CODESIGN_IDENTITY=-" >> "$GITHUB_ENV"
            if [ -n "${{ inputs.tag }}" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::warning::No MACOS_CERTIFICATE_P12_BASE64 secret: this release's .dmg is signed ad hoc and not notarized"
            fi
            exit 0
          fi
          # A keychain of this job's own, deleted with the runner.
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw=$(uuidgen)
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$kc" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)
          if [ -z "$identity" ]; then
            echo "::error::The certificate holds no \"Developer ID Application\" identity"
            security find-identity -v -p codesigning "$kc"
            exit 1
          fi
          echo "NOBION_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "signing as: $identity"

      - name: Configure
        run: |
          gen=(-G Ninja)
          if [ "$RUNNER_OS" = Windows ]; then gen=(-G "Visual Studio 17 2022" -A x64); fi
          cmake -S . -B build "${gen[@]}" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_UI=ON -DBUILD_TESTS=OFF -DNOBION_WARNINGS_AS_ERRORS=OFF \
            -DPython_ROOT_DIR="$PBS" -DPython_FIND_STRATEGY=LOCATION \
            -DNOBION_BUNDLE_PYTHON="$PBS"

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      # A release names the commit it was built from, and a clean one: a build id
      # ending in ".dirty" or "+unknown" cannot be traced to a source.
      - name: Check the build id
        run: |
          elctl_bin=$(find build -type f \( -name elctl -o -name elctl.exe \) -perm -u+x | head -n 1)
          if [ -z "$elctl_bin" ]; then echo "no elctl built"; exit 1; fi
          echo "checking $elctl_bin"
          id=$("$elctl_bin" --version | head -n 1 | tr -d '\r')
          echo "$id"
          if ! printf '%s\n' "$id" | grep -Eq '^elctl [0-9]+\.[0-9]+\.[0-9]+\+[0-9a-f]{12}$'; then
            echo "build id is not a clean, known commit: $id"; exit 1
          fi

      # RelWithDebInfo compiles with -O2 -g where Release did -O3: a numeric
      # fixture that differs under that stops the release. What is packaged
      # (BUILD_TESTS=OFF above) is not changed for it: the suites are built in
      # a second directory, without the UI, which none of them reads.
      - name: Configure the tests
        run: |
          gen=(-G Ninja)
          if [ "$RUNNER_OS" = Windows ]; then gen=(-G "Visual Studio 17 2022" -A x64); fi
          cmake -S . -B build-tests "${gen[@]}" -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_UI=OFF -DBUILD_TESTS=ON -DNOBION_WARNINGS_AS_ERRORS=OFF \
            -DPython_ROOT_DIR="$PBS" -DPython_FIND_STRATEGY=LOCATION \
            -DNOBION_BUNDLE_PYTHON="$PBS"

      - name: Test (release configuration)
        run: |
          targets="nobion_arar_tests nobion_arar_store_tests nobion_arar_records_tests nobion_reduction_tests nobion_processing_tests nobion_processing_store_tests nobion_processing_records_tests nobion_core_tests nobion_vision_tests nobion_crash_helper"
          cmake --build build-tests --config RelWithDebInfo --parallel --target $targets
          # The label is on these suites' gtest_discover_tests, so their own TIMEOUT applies.
          ctest --test-dir build-tests -C RelWithDebInfo -L release_config --parallel 4 --output-on-failure

      # The debug information of the programs, kept as a release asset beside
      # the installers (never inside one). Linux: this also adds the debuglink
      # section to the build-tree files, before cpack copies and strips them.
      - name: Split the symbols
        run: |
          case "$RUNNER_OS" in macOS) os=macos;; Linux) os=linux;; *) os=windows;; esac
          $PY tools/split_symbols.py build symbols --os "$os" --config RelWithDebInfo

      - name: Package
        run: cd build && cpack -C RelWithDebInfo

      # The archive is only any use if it is of the programs the package ships.
      - name: Check the symbols match the package
        if: runner.os != 'Windows'
        run: |
          case "$RUNNER_OS" in macOS) os=macos;; *) os=linux;; esac
          tools/check_shipped_symbols.sh build symbols "$os"

      # A crash of the test helper, named from the split symbols: a symbol
      # archive that does not name a frame of crash_helper.cpp is no use to
      # anyone reading a field crash file. The helper's own symbols come from
      # the tests build (the helper is not packaged).
      - name: Symbolize a crash
        run: |
          case "$RUNNER_OS" in macOS) os=macos;; Linux) os=linux;; *) os=windows;; esac
          $PY tools/split_symbols.py build-tests symbols-tests --os "$os" --config RelWithDebInfo --only nobion_crash_helper
          mkdir -p "$RUNNER_TEMP/syms" "$RUNNER_TEMP/crashlog"
          helper=$(find build-tests -type f \( -name nobion_crash_helper -o -name nobion_crash_helper.exe \) | head -n 1)
          "$helper" "$RUNNER_TEMP/crashlog" segv || true
          if [ "$os" = windows ]; then
            # Windows leaves a minidump: WinDbg or Visual Studio read it, with
            # the PDB archive; the steps are printed, not run.
            dmp=$(find "$RUNNER_TEMP/crashlog/crash" -name '*.dmp' | head -n 1)
            if [ -z "$dmp" ]; then echo "no minidump left"; exit 1; fi
            $PY -m zipfile -e symbols-tests/*.zip "$RUNNER_TEMP/syms"
            $PY tools/symbolize.py "$dmp" --symbols "$RUNNER_TEMP/syms"
            exit 0
          fi
          if [ "$os" = macos ]; then
            $PY -m zipfile -e symbols-tests/*.zip "$RUNNER_TEMP/syms"
          else
            tar --zstd -xf symbols-tests/*.tar.zst -C "$RUNNER_TEMP/syms"
          fi
          crash=$(find "$RUNNER_TEMP/crashlog/crash" -name '*.txt' | head -n 1)
          if [ -z "$crash" ]; then echo "no crash file left"; exit 1; fi
          $PY tools/symbolize.py "$crash" --symbols "$RUNNER_TEMP/syms" --os "$os" | tee "$RUNNER_TEMP/symbolized.txt"
          if ! grep -q crash_helper.cpp "$RUNNER_TEMP/symbolized.txt"; then
            echo "::error::No frame of the symbolized crash names crash_helper.cpp"
            exit 1
          fi

      # Nobion.app was signed when cpack made the image (packaging/macos/cpack_sign.cmake).
      - name: Sign and notarize the disk image (macOS)
        if: runner.os == 'macOS'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          dmg=$(ls build/Nobion-*.dmg)
          if [ "$NOBION_CODESIGN_IDENTITY" = "-" ]; then
            echo "signed ad hoc: the image is not signed or notarized"
            exit 0
          fi
          codesign --force --sign "$NOBION_CODESIGN_IDENTITY" --timestamp "$dmg"
          codesign --verify --verbose=2 "$dmg"
          if [ -z "$API_KEY" ]; then
            echo "::warning::No APPLE_API_KEY_P8_BASE64 secret: the .dmg is signed but not notarized"
            exit 0
          fi
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$API_KEY" | base64 --decode > "$key"
          xcrun notarytool submit "$dmg" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
            --wait --timeout 1h --output-format json | tee "$RUNNER_TEMP/notary.json"
          read -r id status < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("id",""), d.get("status",""))' "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            # Apple's log names each file it refused and why.
            [ -n "$id" ] && xcrun notarytool log "$id" --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
            rm -f "$key"
            echo "::error::Notarization: ${status:-no answer}"
            exit 1
          fi
          rm -f "$key"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          echo "NOBION_NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./build/nobion_*.deb
          elctl --version
          QT_QPA_PLATFORM=offscreen nobion --self-test
          export NOBION_SITE_CONFIG="$RUNNER_TEMP/site.toml"
          elctl init data-reduction --root "$RUNNER_TEMP/dr" --yes
          elctl init argus --root "$RUNNER_TEMP/argus" --yes
          elctl --install argus exp run experiment.toml --sim-speed 200

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach build/Nobion-*.dmg -mountpoint /Volumes/Nobion
          cp -R /Volumes/Nobion/Nobion.app "$RUNNER_TEMP/"
          hdiutil detach /Volumes/Nobion
          # Signed throughout, with the hardened runtime and the camera entitlement;
          # what follows then runs (Python included) under that runtime.
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Nobion.app"
          codesign --display --verbose=2 "$RUNNER_TEMP/Nobion.app" 2>&1 | grep -E 'flags=.*runtime'
          entitlements=$(codesign --display --entitlements - --xml "$RUNNER_TEMP/Nobion.app")
          grep -q com.apple.security.device.camera <<< "$entitlements"
          codesign --display --verbose=2 "$RUNNER_TEMP/Nobion.app/Contents/MacOS/elctl" 2>&1 | grep -E 'flags=.*runtime'
          if [ "${NOBION_NOTARIZED:-}" = 1 ]; then
            # What Gatekeeper decides for a user who downloaded it.
            spctl --assess --type open --context context:primary-signature --verbose=2 build/Nobion-*.dmg
            spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/Nobion.app"
          fi
          app="$RUNNER_TEMP/Nobion.app/Contents/MacOS"
          "$app/elctl" --version
          "$app/Nobion" --self-test  # macdeployqt ships the cocoa platform plugin only
          export NOBION_SITE_CONFIG="$RUNNER_TEMP/site.toml"
          "$app/elctl" init argus --root "$RUNNER_TEMP/argus" --yes
          "$app/elctl" --install argus exp run experiment.toml --sim-speed 200

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/zip" && $PY -m zipfile -e build/Nobion-*.zip "$RUNNER_TEMP/zip"
          bin=$(ls -d "$RUNNER_TEMP"/zip/*/bin)
          "$bin/elctl.exe" --version
          "$bin/nobion.exe" --self-test  # windeployqt ships the windows platform plugin only
          export NOBION_SITE_CONFIG="$RUNNER_TEMP/site.toml"
          "$bin/elctl.exe" init argus --root "$RUNNER_TEMP/argus" --yes
          "$bin/elctl.exe" --install argus exp run experiment.toml --sim-speed 200

      # One flat directory: upload-artifact roots an artifact at the paths'
      # common ancestor, so build/* beside symbols/* would arrive as
      # dist/build/* and dist/symbols/*, and `files: dist/*` would attach
      # nothing. Every name carries its platform (Nobion-<version>-<os>...,
      # nobion-<version>-<os>-<arch>.<kind>), so merge-multiple below cannot
      # have one OS's file overwrite another's; a name met twice fails here.
      - name: Stage the release files
        run: |
          mkdir -p out
          shopt -s nullglob
          for f in build/*.deb build/*.tar.gz build/*.dmg build/*.exe build/*.zip symbols/*; do
            if [ -e "out/$(basename "$f")" ]; then echo "::error::$(basename "$f") staged twice"; exit 1; fi
            cp "$f" out/
          done

      - uses: actions/upload-artifact@v4
        with:
          name: nobion-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # release-please has written the notes; a tag pushed by hand gets GitHub's.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: ${{ inputs.tag == '' }}
